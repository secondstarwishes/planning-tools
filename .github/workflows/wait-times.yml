name: Update wait times
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wait-times
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch wait times from Queue-Times.com
        run: python3 scripts/fetch_waits.py
      - name: Save
        if: always()
        run: |
          git config user.name "SSW wait-times bot"
          git config user.email "actions@users.noreply.github.com"
          git add wait-times/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "Update wait times"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
